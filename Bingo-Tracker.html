<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bingo Tracker</title>
<style>
:root{
    --bg:#121212;
    --panel:#1e1e1e;
    --text:#ffffff;
    --button:#2d6cdf;
    --called:#2e7d32;
    --last:#fbc02d;
    --uncalled:#333333;
}
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:10px;
}
.panel{
    background:var(--panel);
    border-radius:12px;
    padding:12px;
    margin-bottom:12px;
}
h2,h3{margin:0 0 10px 0}
#lastBall{
    font-size:48px;
    text-align:center;
    font-weight:bold;
}
.button-row{
    display:flex;
    gap:8px;
    margin-bottom:8px;
}
button{
    border:none;
    border-radius:10px;
    padding:14px;
    font-size:20px;
    color:white;
    background:var(--button);
    cursor:pointer;
}
button.selected{
    outline:4px solid white;
}
.letter-btn{
    flex:1;
}
.number-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:6px;
}
.number-btn{
    padding:16px;
}
.action-btn{
    width:100%;
    margin-top:10px;
    font-size:24px;
    padding:18px;
}
.board{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:4px;
}
.column-header{
    text-align:center;
    font-size:28px;
    font-weight:bold;
}
.ball{
    text-align:center;
    padding:8px 2px;
    border-radius:6px;
    background:var(--uncalled);
}
.called{
    background:var(--called);
}
.last{
    background:var(--last);
    color:black;
    font-weight:bold;
}
#history{
    max-height:250px;
    overflow:auto;
}
.history-item{
    padding:4px 0;
    border-bottom:1px solid #444;
}
.toggle{
    display:flex;
    gap:10px;
    margin-bottom:10px;
}
.verify-input{
    width:100%;
    padding:10px;
    margin-bottom:8px;
    font-size:18px;
}
#verifyResult{
    margin-top:10px;
    font-size:20px;
    font-weight:bold;
}
.hidden{
    display:none;
}
</style>
</head>
<body>

<div class="panel">
    <h2>Last Ball Called</h2>
    <div id="lastBall">--</div>
</div>

<div class="panel">
    <h2>Current Selection: <span id="selection">B1</span></h2>

    <div class="button-row">
        <button class="letter-btn selected" data-letter="B">B</button>
        <button class="letter-btn" data-letter="I">I</button>
        <button class="letter-btn" data-letter="N">N</button>
        <button class="letter-btn" data-letter="G">G</button>
        <button class="letter-btn" data-letter="O">O</button>
    </div>

    <div class="number-grid" id="numberGrid"></div>

    <button class="action-btn" id="callBtn">CALL BALL</button>
</div>

<div class="panel">
    <div class="toggle">
        <button id="showAllBtn">All Balls</button>
        <button id="showCalledBtn">Called Only</button>
    </div>
    <div id="boardContainer"></div>
</div>

<div class="panel">
    <h3>History</h3>
    <div id="history"></div>
</div>

<div class="panel">
    <div class="button-row">
        <button id="undoBtn">Undo</button>
        <button id="verifyBtn">Verify</button>
        <button id="resetBtn">Reset</button>
    </div>
</div>

<div class="panel hidden" id="verifyPanel">
    <h3>Verify Bingo</h3>

    <input class="verify-input" placeholder="Ball 1 (e.g. B12)">
    <input class="verify-input" placeholder="Ball 2">
    <input class="verify-input" placeholder="Ball 3">
    <input class="verify-input" placeholder="Ball 4">
    <input class="verify-input" placeholder="Ball 5">

    <button id="runVerify">VERIFY</button>

    <div id="verifyResult"></div>
</div>

<script>
let calledBalls = JSON.parse(localStorage.getItem("calledBalls") || "[]");

let selectedLetter = "B";
let selectedNumber = 1;
let showCalledOnly = false;

const letterOffsets = {
    B:0,
    I:15,
    N:30,
    G:45,
    O:60
};

function save(){
    localStorage.setItem("calledBalls", JSON.stringify(calledBalls));
}

function getBall(letter,num){
    return letter + (num + letterOffsets[letter]);
}

function updateSelection(){
    document.getElementById("selection").textContent =
        getBall(selectedLetter, selectedNumber);
}

function renderNumbers(){
    const grid = document.getElementById("numberGrid");
    grid.innerHTML = "";

    for(let i=1;i<=15;i++){
        const btn = document.createElement("button");
        btn.className = "number-btn";
        btn.textContent = i;

        if(i === selectedNumber){
            btn.classList.add("selected");
        }

        btn.onclick = ()=>{
            selectedNumber = i;
            renderNumbers();
            updateSelection();
        };

        grid.appendChild(btn);
    }
}

function renderBoard(){
    const container = document.getElementById("boardContainer");
    container.innerHTML = "";

    if(showCalledOnly){
        let html = "";

        ["B","I","N","G","O"].forEach(letter=>{
            const list = calledBalls.filter(x=>x.startsWith(letter));
            html += `<h3>${letter}: ${list.join(", ") || "None"}</h3>`;
        });

        container.innerHTML = html;
        return;
    }

    const board = document.createElement("div");
    board.className = "board";

    ["B","I","N","G","O"].forEach(letter=>{
        const head = document.createElement("div");
        head.className = "column-header";
        head.textContent = letter;
        board.appendChild(head);
    });

    for(let row=1;row<=15;row++){
        ["B","I","N","G","O"].forEach(letter=>{
            const ball = getBall(letter,row);

            const div = document.createElement("div");
            div.className = "ball";
            div.textContent = ball;

            if(calledBalls.includes(ball))
                div.classList.add("called");

            if(calledBalls.length &&
                ball === calledBalls[calledBalls.length-1]){
                div.classList.remove("called");
                div.classList.add("last");
            }

            board.appendChild(div);
        });
    }

    container.appendChild(board);
}

function renderHistory(){
    const history = document.getElementById("history");
    history.innerHTML = "";

    [...calledBalls].reverse().forEach(ball=>{
        const div = document.createElement("div");
        div.className = "history-item";
        div.textContent = ball;
        history.appendChild(div);
    });
}

function renderLastBall(){
    document.getElementById("lastBall").textContent =
        calledBalls.length ? calledBalls[calledBalls.length-1] : "--";
}

function refresh(){
    renderBoard();
    renderHistory();
    renderLastBall();
    save();
}

document.querySelectorAll(".letter-btn").forEach(btn=>{
    btn.onclick = ()=>{
        document.querySelectorAll(".letter-btn")
            .forEach(b=>b.classList.remove("selected"));

        btn.classList.add("selected");
        selectedLetter = btn.dataset.letter;
        updateSelection();
    };
});

document.getElementById("callBtn").onclick = ()=>{
    const ball = getBall(selectedLetter, selectedNumber);

    if(calledBalls.includes(ball)){
        alert(ball + " has already been called.");
        return;
    }

    calledBalls.push(ball);

    if(navigator.vibrate){
        navigator.vibrate(100);
    }

    refresh();
};

document.getElementById("undoBtn").onclick = ()=>{
    if(!calledBalls.length) return;

    calledBalls.pop();
    refresh();
};

document.getElementById("resetBtn").onclick = ()=>{
    const text = prompt('Type RESET to clear game');

    if(text === "RESET"){
        calledBalls = [];
        refresh();
    }
};

document.getElementById("verifyBtn").onclick = ()=>{
    document.getElementById("verifyPanel")
        .classList.toggle("hidden");
};

document.getElementById("runVerify").onclick = ()=>{
    const inputs =
        [...document.querySelectorAll(".verify-input")];

    const balls = inputs
        .map(x=>x.value.trim().toUpperCase())
        .filter(x=>x);

    const missing = balls.filter(
        x=>!calledBalls.includes(x)
    );

    const result =
        document.getElementById("verifyResult");

    if(missing.length === 0 && balls.length === 5){
        result.innerHTML = "✅ VALID BINGO";
    } else {
        result.innerHTML =
            "❌ INVALID BINGO<br><br>Missing:<br>" +
            missing.join("<br>");
    }
};

document.getElementById("showAllBtn").onclick = ()=>{
    showCalledOnly = false;
    renderBoard();
};

document.getElementById("showCalledBtn").onclick = ()=>{
    showCalledOnly = true;
    renderBoard();
};

renderNumbers();
updateSelection();
refresh();
</script>

</body>
</html>
